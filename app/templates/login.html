<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - {{ 'Setuora Lite' if app_mode == 'lite' else 'Setuora' }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css?v=20260918-editorial-1">
  <link rel="stylesheet" href="/static/design-system.css?v=20260918-editorial-1">
  <meta name="theme-color" content="#faf9f5">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <div class="auth-brand" aria-label="Setuora Lite"><span class="brand__mark">Setuora</span><span class="brand__edition">Lite</span></div>
    <section class="auth-panel">
      <div>
        <h1>Welcome back.</h1>
        <p class="muted">
          {{ 'Run local stock operations and synchronize them with Setuora Master.' if app_mode == 'lite' else 'Sign in to scan stock and sync with Tally.' }}
        </p>
      </div>
      {% if error %}
      <div class="alert error">{{ error }}</div>
      {% endif %}
      {% if message %}
      <div class="alert">{{ message }}</div>
      {% endif %}
      <form method="post" action="/login" class="stack">
        <label>Username<input name="username" autocomplete="username" maxlength="80" required autofocus></label>
        <label>Password
          <span class="password-field" data-password-field>
            <input name="password" type="password" autocomplete="current-password" maxlength="1024" required>
            <button class="button small ghost" type="button" data-password-toggle aria-pressed="false">Show</button>
          </span>
        </label>
        <button class="button primary full" type="submit">Login</button>
      </form>
    </section>
  </main>
  <script src="/static/password-toggle.js?v=20260624-expiry-1"></script>
</body>
</html>
