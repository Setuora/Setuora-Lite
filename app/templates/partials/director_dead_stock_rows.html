{% for row in report.dead_stock_rows[:12] %}
<tr>
  <td class="cell-wrap"><strong>{{ row.product_name }}</strong></td>
  <td class="numeric">{{ row.stock }}</td>
  <td class="cell-date">{{ row.last_sale }}</td>
  <td class="numeric">Rs {{ '%.0f'|format(row.value) }}</td>
</tr>
{% else %}
<tr><td colspan="4" class="empty">No dead stock found</td></tr>
{% endfor %}
