{% for row in report.warehouse_rows %}
<tr>
  <td><strong>{{ row.warehouse_level }}</strong></td>
  <td class="numeric">{{ row.warehouses }}</td>
  <td class="numeric">{{ row.products }}</td>
  <td class="numeric">{{ row.locations }}</td>
  <td class="numeric"><span class="status {{ 'pending_sync' if row.unlocated else 'synced' }}">{{ row.unlocated }}</span></td>
  <td class="numeric"><span class="status {{ 'missing' if row.expiring_soon else 'synced' }}">{{ row.expiring_soon }}</span></td>
  <td class="cell-date">{{ report_date(row.nearest_expiry) if row.nearest_expiry else '-' }}</td>
  <td class="numeric"><strong>{{ row.stock }}</strong></td>
</tr>
{% else %}
<tr><td colspan="8" class="empty">No stock available</td></tr>
{% endfor %}
