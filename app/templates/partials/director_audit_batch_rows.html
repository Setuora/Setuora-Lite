{% for row in report.audit_batches %}
<tr>
  <td class="col-actions"><a class="button primary director-open" href="/reports/audit-batches/{{ row.id }}">Open</a></td>
  <td class="cell-code"><strong>{{ row.batch_number }}</strong></td>
  <td class="cell-date">{{ report_date(row.audit_at) }}</td>
  <td>{{ row.audited_by }}</td>
  <td class="numeric">{{ row.products }}</td>
  <td class="numeric"><span class="status {{ 'pending_sync' if row.pending else 'synced' }}">{{ row.pending }}</span></td>
  <td class="numeric"><span class="status {{ 'missing' if row.missing else 'synced' }}">{{ row.missing }}</span></td>
  <td class="numeric"><span class="status {{ 'extra' if row.extra else 'synced' }}">{{ row.extra }}</span></td>
</tr>
{% else %}
<tr><td colspan="8" class="empty">No audit batches found</td></tr>
{% endfor %}
